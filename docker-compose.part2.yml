# iCSI-Web-CTF — Part 2 of 3
# Start parts in order (see README.md). Splitting the pulls keeps each
# step under Docker Hub's unauthenticated pull rate limit.

services:
  ctf-zone-transfer:
    image: joshbeck2024/ctf-zone-transfer:latest
    restart: unless-stopped
    ports:
      - "5454:53"
      - "5454:53/udp"
      - "5555:80"

  ctf-json-post:
    image: joshbeck2024/ctf-json-post:latest
    restart: unless-stopped
