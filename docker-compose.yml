    restart: unless-stopped
    ports:
      - "9020:80"

  cookie_bot-ctf-challenge:
    image: joshbeck2024/cookie_bot-ctf-challenge:latest
    restart: unless-stopped
    ports:
      - "3005:3005"

  cookie_guessing:
