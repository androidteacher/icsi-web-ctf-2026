# iCSI-Web-CTF — full environment
# Generated from the live challenge set. Brings up CTFd (with all 68
# challenges, flags, theme and admin baked into the app+db images) plus
# every challenge container, all pulled from Docker Hub.
#
# Admin login: admin / admin   |   CTFd: http://<host>:8000

services:

  # ---- CTFd platform (data baked into these two images) ----
  db:
    image: joshbeck2024/2026-icsi-web-ctf-1-db:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ctfd
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ctfd
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 40

  ctfd:
    image: joshbeck2024/2026-icsi-web-ctf-1:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - SECRET_KEY=icsi-web-ctf-secret-key-2026
      - WORKERS=2
      - REVERSE_PROXY=true
    ports:
      - "8000:8000"

  # ---- Challenge containers (45) ----
  ctf-chacha_challenge:
    image: joshbeck2024/ctf-chacha_challenge:latest
    restart: unless-stopped
    ports:
      - "3333:3333"

  ctf-ping-command-injection:
    image: joshbeck2024/ctf-ping-command-injection:latest
    restart: unless-stopped
    ports:
      - "3666:5000"

