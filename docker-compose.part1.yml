# iCSI-Web-CTF — Part 1 of 3
# Start parts in order (see README.md). Splitting the pulls keeps each
# step under Docker Hub's unauthenticated pull rate limit.
# Part 1 includes the CTFd platform (db + ctfd) and the pivot pair.

services:
  # ---- CTFd platform (challenge data baked into these two images) ----
  db:
    image: joshbeck2024/2026-icsi-web-ctf-1-db:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ctfd
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ctfd
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 40

  ctfd:
    image: joshbeck2024/2026-icsi-web-ctf-1:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - SECRET_KEY=icsi-web-ctf-secret-key-2026
      - WORKERS=2
      - REVERSE_PROXY=true
    ports:
      - "8000:8000"

  pivot1:
    image: joshbeck2024/pivot1:latest
    restart: unless-stopped
    ports:
      - "5888:80"
      - "5889:22"
    networks:
      pivot_internal:
        ipv4_address: 10.0.0.10

  pivot2:
    image: joshbeck2024/pivot2:latest
    restart: unless-stopped
    networks:
      pivot_internal:
        ipv4_address: 10.0.0.26

  ctf-chacha_challenge:
    image: joshbeck2024/ctf-chacha_challenge:latest
    restart: unless-stopped
    ports:
      - "3333:3333"

  ctf-ping-command-injection:
    image: joshbeck2024/ctf-ping-command-injection:latest
    restart: unless-stopped
    ports:
      - "3666:5000"

  bacon_ctf:
    image: joshbeck2024/bacon_ctf:latest
    restart: unless-stopped
    ports:
      - "9090:80"

  brute_login_ctf:
    image: joshbeck2024/brute_login_ctf:latest
    restart: unless-stopped
    ports:
      - "9898:80"

  front-end-bypass-challenge:
    image: joshbeck2024/front-end-bypass-challenge:latest
    restart: unless-stopped
    ports:
      - "9020:80"

  cookie_bot-ctf-challenge:
    image: joshbeck2024/cookie_bot-ctf-challenge:latest
    restart: unless-stopped
    ports:
      - "3005:3005"

  cookie_guessing:
    image: joshbeck2024/cookie_guessing:latest
    restart: unless-stopped
    ports:
      - "9797:80"

  ctf-sql-2:
    image: joshbeck2024/ctf-sql-2:latest
    restart: unless-stopped
    ports:
      - "9088:80"

  cors_ctf_challenge:
    image: joshbeck2024/cors_ctf_challenge:latest
    restart: unless-stopped
    ports:
      - "9003:80"

  403-bypass-ctf:
    image: joshbeck2024/403-bypass-ctf:latest
    restart: unless-stopped
    ports:
      - "3030:3030"

  ctf-alphabet-soup:
    image: joshbeck2024/ctf-alphabet-soup:latest
    restart: unless-stopped
    ports:
      - "3777:5000"

  ctf-ascii-rev:
    image: joshbeck2024/ctf-ascii-rev:latest
    restart: unless-stopped
    ports:
      - "3111:3111"

# Isolated network for the pivot challenge; participants must pivot through
# pivot1 (10.0.0.10) to reach pivot2 (10.0.0.26).
networks:
  pivot_internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
